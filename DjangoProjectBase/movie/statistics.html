<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        h1 { color: #111; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f9f9f9; margin-bottom: 10px; padding: 15px; border-radius: 5px; border: 1px solid #eee; }
        strong { color: #007bff; }
        a { color: #007bff; }
    </style>
</head>
<body>
    <h1>Estadísticas de la Base de Datos</h1>
    <ul>
        <li>Número total de películas: <strong>{{ total_movies }}</strong></li>
        <li>Películas con embeddings generados: <strong>{{ movies_with_embeddings }}</strong></li>
    </ul>
    <br>
    <a href="{% url 'movie:recommend' %}">Volver al recomendador</a>
</body>
</html>
